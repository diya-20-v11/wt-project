<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Interior Studio</title>
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-login-body">

  <div class="login-card">
    <!-- Brand Logo from Figure 2.1 Wireframe -->
    <div class="login-brand-logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#b8860b" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="3" y1="9" x2="21" y2="9"></line>
        <line x1="9" y1="21" x2="9" y2="9"></line>
      </svg>
    </div>
    <div class="login-brand-name">INTERIOR STUDIO</div>
    <div class="login-brand-tagline">Designing Dreams</div>

    <h2 class="login-card-title">ADMIN LOGIN</h2>

    <div id="adminLoginError" style="display:none; background:#fff5f5; color:#c53030; border:1px solid #fed7d7; padding:10px 14px; border-radius:4px; font-size:13px; margin-bottom:18px;"></div>

    <form id="adminLoginForm">
      <!-- Username / Email Input with Icon -->
      <div class="input-icon-group">
        <span class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </span>
        <input type="text" id="adminUsername" placeholder="Username / Email" value="admin">
      </div>

      <!-- Password Input with Icon -->
      <div class="input-icon-group">
        <span class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </span>
        <input type="password" id="adminPassword" placeholder="Password" value="admin123">
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="login-extras">
        <label>
          <input type="checkbox" id="adminRemember" checked>
          <span>Remember Me</span>
        </label>
        <a href="#" onclick="alert('Password reset instructions dispatched to registered administrator email.'); return false;">Forgot Password?</a>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-admin-login">LOGIN</button>
    </form>

    <div style="margin-top: 20px; font-size: 13px;">
      <a href="../Client/1-%20Home%20Page.html" style="color:#718096; text-decoration:none;">&larr; Return to Client Website</a>
    </div>

    <!-- Copyright (Figure 2.1 Wireframe) -->
    <div class="login-copyright">
      &copy; 2025 Interior Studio. All rights reserved.
    </div>
  </div>

  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
